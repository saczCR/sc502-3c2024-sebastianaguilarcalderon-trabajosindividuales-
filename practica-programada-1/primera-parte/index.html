<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Formulario de Registro</h1>
    <p>Por favor complete este formulario con la información requerida</p>

    <form method="post" action="https://register-demo.freecodecamp.org">
      <fieldset>
        <label for="first-name">Ingrese su nombre:
          <input id="first-name" name="first-name" type="text" required />
        </label>
        <label for="last-name">Ingrese sus apellidos:
          <input id="last-name" name="last-name" type="text" required />
        </label>
        <label for="email">Ingrese su correo electrónico:
          <input id="email" name="email" type="email" required />
        </label>
        <label for="new-password">Cree una contraseña (mínimo 8 caracteres):
          <input id="new-password" name="new-password" type="password"
                 pattern=".{8,}" title="Mínimo 8 caracteres" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Tipo de cuenta</legend>
        <label for="personal-account">
          <input id="personal-account" type="radio" name="account-type" class="inline" checked />
          Cuenta personal
        </label>
        <label for="business-account">
          <input id="business-account" type="radio" name="account-type" class="inline" />
          Cuenta empresarial
        </label>
        <label for="terms-and-conditions">
          <input id="terms-and-conditions" type="checkbox" name="terms-and-conditions" class="inline" required />
          Acepto los <a href="https://www.freecodecamp.org/news/terms-of-service/">términos y condiciones</a>
        </label>
      </fieldset>

      <fieldset>
        <label for="profile-picture">Suba una foto de perfil:
          <input id="profile-picture" type="file" name="file" />
        </label>
        <label for="age">Ingrese su edad (años):
          <input id="age" type="number" name="age" min="13" max="120" />
        </label>
        <label for="referrer">¿Cómo se enteró de nosotros?
          <select id="referrer" name="referrer">
            <option value="">(seleccione una)</option>
            <option value="1">Un amigo</option>
            <option value="2">Redes sociales</option>
            <option value="3">Un buscador web</option>
            <option value="4">Publicidad</option>
            <option value="5">Otro</option>
          </select>
        </label>
        <label for="bio">Escriba una breve biografía:
          <textarea id="bio" name="bio" rows="3" cols="30" placeholder="Me gusta programar en la playa..."></textarea>
        </label>
      </fieldset>

      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
